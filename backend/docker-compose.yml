services:
  database:
    image: postgis/postgis:13-3.4
    container_name: bruecke_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - bruecke_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  cache:
    image: redis:6-alpine
    container_name: bruecke_cache
    restart: always
    networks:
      - bruecke_net
    deploy:
      resources:
        limits:
          memory: 128M

  directus:
    image: directus/directus:11
    container_name: bruecke_cms
    restart: always
    ports:
      - "127.0.0.1:8055:8055"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      KEY: ${KEY}
      SECRET: ${SECRET}
      
      # Admin Account
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      
      # Datenbank
      DB_CLIENT: 'pg'
      DB_HOST: 'bruecke_db'
      DB_PORT: '5432'
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Performance & Cache (Redis vorbereitet)
      CACHE_ENABLED: 'false'
      CACHE_STORE: 'memory'
      # CACHE_REDIS: 'redis://bruecke_cache:6379'
      
      # System & Security
      STORAGE_LOCATIONS: 'local'
      STORAGE_LOCAL_ROOT: '/directus/uploads'
      
      # URL & CORS
      PUBLIC_URL: "https://api.diebruecke.social"
      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'true'
      
      # Asset Security (Tailwind v4 / Astro Frontend Erlaubnis)
      CONTENT_SECURITY_POLICY_DIRECTIVES__IMG_SRC: "'self' data: https://api.diebruecke.social https://beta.diebruecke.social"
      
      # Features
      WEBSOCKETS_ENABLED: 'false'
      FLOWS_EXEC_ALLOWED_MODULES: "*"
      FLOWS_EXEC_DRIVER: "nodejs"

    volumes:
      - ./uploads:/directus/uploads
      - ./schema:/directus/schema
      - ./extensions:/directus/extensions
    networks:
      - bruecke_net
    deploy:
      resources:
        limits:
          memory: 1024M

networks:
  bruecke_net:
    driver: bridge

volumes:
  db_data:
