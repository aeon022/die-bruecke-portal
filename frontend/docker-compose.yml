services:
  beta_frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # WICHTIG: Das hier hat gefehlt!
      args:
        DIRECTUS_URL: https://api.diebruecke.social
    container_name: bruecke_beta
    restart: always
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      - DIRECTUS_URL=https://api.diebruecke.social
      - PUBLIC_DIRECTUS_URL=https://api.diebruecke.social 
      - HOST=0.0.0.0
      # Directus liefert Zeiten ohne Zeitzone (Wiener Ortszeit); ohne TZ rechnet Node in UTC → Kalender-Links 1 h daneben
      - TZ=Europe/Vienna
      - PORT=4321
      - DIRECTUS_FORM_TOKEN=${DIRECTUS_FORM_TOKEN:-}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_LIST_ID=${BREVO_LIST_ID}
      - BREVO_GEWINNSPIEL_LIST_ID=${BREVO_GEWINNSPIEL_LIST_ID:-}
      - BREVO_DOI_TEMPLATE_ID=${BREVO_DOI_TEMPLATE_ID}
      - BREVO_DOI_REDIRECT_URL=${BREVO_DOI_REDIRECT_URL}
      - MEMBERS_API_URL=${MEMBERS_API_URL:-https://internal.diebruecke.social}
      - MEMBERS_API_KEY=${MEMBERS_API_KEY:-}
